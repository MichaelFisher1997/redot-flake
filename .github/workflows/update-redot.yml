name: Update Redot

on:
  schedule:
    - cron: '0 6 * * 1'  # Weekly on Monday at 6 AM UTC
  workflow_dispatch:  # Manual trigger

permissions:
  contents: write

concurrency:
  group: update-redot
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v23

      - name: Get latest stable Redot release
        id: redot-release
        run: |
          # Get the latest non-prerelease release
          RELEASE=$(curl -sS \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/Redot-Engine/redot-engine/releases)

          echo "$RELEASE" | jq -r '[.[] | select(.prerelease == false)][0]' > "$RUNNER_TEMP/release.json"

          TAG=$(jq -r '.tag_name // empty' "$RUNNER_TEMP/release.json")
          if [[ -z "$TAG" ]]; then
            echo "::error::Could not find a stable Redot release"
            exit 1
          fi

          # Extract version without "redot-" prefix for version string
          VERSION="${TAG#redot-}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Latest stable release: $TAG (version: $VERSION)"

      - name: Check if update needed
        id: check-update
        run: |
          CURRENT_VERSION=$(grep -m1 'version = ' flake.nix | sed 's/.*version = "\([^"]*\)".*/\1/')
          echo "current=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"
          echo "Current version: $CURRENT_VERSION"
          echo "Latest version: ${{ steps.redot-release.outputs.version }}"

          if [[ "$CURRENT_VERSION" != "${{ steps.redot-release.outputs.version }}" ]]; then
            echo "needs_update=true" >> "$GITHUB_OUTPUT"
            echo "Update needed!"
          else
            echo "needs_update=false" >> "$GITHUB_OUTPUT"
            echo "Already up to date"
          fi

      - name: Update version and hashes
        if: steps.check-update.outputs.needs_update == 'true'
        run: |
          VERSION="${{ steps.redot-release.outputs.version }}"
          TAG="${{ steps.redot-release.outputs.tag }}"
          RELEASE_URL="https://github.com/Redot-Engine/redot-engine/releases/download/${TAG}"

          # Prefer the sha256 digest reported by the GitHub API;
          # fall back to downloading the asset if it is missing.
          get_hash() {
            local asset="$1"
            local digest
            digest=$(jq -r --arg name "$asset" '.assets[] | select(.name == $name) | .digest // empty' "$RUNNER_TEMP/release.json")

            if [[ "$digest" == sha256:* ]]; then
              echo "sha256-$(echo "${digest#sha256:}" | xxd -r -p | base64 -w0)"
            else
              nix-prefetch-url "${RELEASE_URL}/${asset}" | nix-hash --type sha256 --to-sri
            fi
          }

          HASH_X86_64=$(get_hash "Redot_v${VERSION}_linux_x64.zip")
          HASH_ARM64=$(get_hash "Redot_v${VERSION}_linux_arm64.zip")
          HASH_MACOS=$(get_hash "Redot_v${VERSION}_macos_universal.zip")

          echo "Hashes:"
          echo "  x86_64-linux:  $HASH_X86_64"
          echo "  aarch64-linux: $HASH_ARM64"
          echo "  macOS:         $HASH_MACOS"

          if [[ -z "$HASH_X86_64" || -z "$HASH_ARM64" || -z "$HASH_MACOS" ]]; then
            echo "::error::Failed to compute one or more hashes"
            exit 1
          fi

          # Update version in flake.nix
          sed -i "s/version = \"[^\"]*\";/version = \"${VERSION}\";/" flake.nix

          # Update hashes in flake.nix (the hash line follows each asset URL)
          sed -i "/_linux_x64\.zip/{n;s|hash = \"sha256-[^\"]*\"|hash = \"${HASH_X86_64}\"|}" flake.nix
          sed -i "/_linux_arm64\.zip/{n;s|hash = \"sha256-[^\"]*\"|hash = \"${HASH_ARM64}\"|}" flake.nix
          sed -i "/_macos_universal\.zip/{n;s|hash = \"sha256-[^\"]*\"|hash = \"${HASH_MACOS}\"|}" flake.nix

          echo "Changes:"
          git diff flake.nix

      - name: Validate build
        if: steps.check-update.outputs.needs_update == 'true'
        run: nix build --no-link --print-out-paths

      - name: Commit and push
        if: steps.check-update.outputs.needs_update == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flake.nix
          git commit -m "Update Redot to ${{ steps.redot-release.outputs.version }}"
          git pull --rebase origin main
          git push
